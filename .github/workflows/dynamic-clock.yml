name: Dynamic Clock build

# Builds the app from DynamicClock.zip whenever that file is uploaded (or run it by hand).
on:
  push:
    paths:
      - 'DynamicClock.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir dc
          unzip -q DynamicClock.zip -d dc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          cd dc
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicclock-debug
          path: dc/app/build/outputs/apk/debug/*.apk
